[package]
name = "dns_benchmark"
version = "0.1.0"
edition = "2024"
description = "A DNS benchmark tool"
keywords = ["dns", "benchmark"]
categories = ["network-programming"]

[lints.clippy]
multiple_crate_versions = "allow"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
rand = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
bytes = "1.11.1"
futures = "0.3.32"
indicatif = "0.18.4"
